# nginx config for the DermaScan frontend container.
# Serves the static site and proxies /api/* to the backend service so the
# browser can use same-origin requests (no CORS needed in this setup).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets / pages.
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy API calls to the backend container.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # allow up to the 10 MB upload + headroom
    }
}
