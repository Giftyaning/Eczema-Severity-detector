<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground — DermaScan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="nav"><div class="nav-inner">
    <a class="nav-brand" href="index.html"><span class="dot"></span> DermaScan</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="results.html">Results</a>
      <a href="dataset.html">Dataset</a>
      <a href="benchmark.html">Benchmark</a>
      <a href="playground.html">Playground</a>
      <a href="about.html">About</a>
      <a href="api.html">API</a>
    </div>
  </div></nav>

  <main class="container section">
    <h1>API playground</h1>
    <p class="secondary">
      Send a live request to <span class="api-path">POST /api/v1/predict</span> and inspect the raw JSON response.
    </p>

    <div class="grid grid-2" style="margin-top:18px">
      <!-- Request panel -->
      <div class="card">
        <h3>Request</h3>

        <label class="dropzone" id="dropzone" style="padding:28px">
          <div class="icon">⬆</div>
          <div id="dzText"><strong>Choose an image</strong> (JPEG / PNG)</div>
          <input type="file" id="fileInput" accept="image/jpeg,image/png" />
        </label>
        <img id="thumb" class="preview-img hidden" style="max-width:140px;margin-top:12px" alt="preview" />

        <div class="row" style="margin-top:16px">
          <label class="field">
            model
            <select id="model">
              <option value="both">both</option>
              <option value="cnn">cnn</option>
              <option value="mobilenet">mobilenet</option>
            </select>
          </label>
          <label class="field">
            gradcam
            <select id="gradcam">
              <option value="true">true</option>
              <option value="false">false</option>
            </select>
          </label>
        </div>

        <div class="row" style="margin-top:16px">
          <button class="btn btn-primary" id="sendBtn" disabled>Send request</button>
          <span id="spin" class="spinner hidden"></span>
        </div>
        <div id="err" class="warn" style="margin-top:8px"></div>
      </div>

      <!-- Response panel -->
      <div class="card">
        <div class="row">
          <h3 style="margin:0">Response</h3>
          <div class="spacer"></div>
          <span id="status" class="muted"></span>
        </div>
        <pre id="response" style="margin-top:12px;min-height:260px">// response will appear here</pre>
        <img id="overlay" class="preview-img hidden" style="max-width:200px;margin-top:12px" alt="grad-cam overlay" />
      </div>
    </div>
  </main>

  <footer><div class="container">
    DermaScan · Requests go to your running backend. Images are processed in memory only.
  </div></footer>

  <script src="js/app.js"></script>
  <script src="js/playground.js"></script>
</body>
</html>
